[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formula-rl"
version = "0.1.0"
description = "Formula 1 position telemetry and geometry diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastf1>=3.9,<4", "numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["formularl"]

[tool.ruff.lint]
extend-select = ["I"]
